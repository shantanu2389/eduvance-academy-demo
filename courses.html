
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses | Eduvance Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<main>
    <section class="page-hero">
        <span class="eyebrow">OUR ACADEMIC PROGRAMS</span>
        <h1>Courses that match<br>your <span>ambition.</span></h1>
        <p>Explore academic programs designed to help you build knowledge and confidence.</p>
    </section>

    <section class="section">
        <div class="course-filter">
            <button class="filter-btn active" data-filter="all">All Courses</button>
            <button class="filter-btn" data-filter="class10">Class 10</button>
            <button class="filter-btn" data-filter="medical">Medical</button>
            <button class="filter-btn" data-filter="nonmedical">Non-Medical</button>
            <button class="filter-btn" data-filter="commerce">Commerce</button>
        </div>

        <div class="course-grid course-grid-page" id="allCourses"></div>
    </section>

    <section class="section course-note">
        <div>
            <span class="eyebrow">NEED HELP CHOOSING?</span>
            <h2>Not sure which course is right for you?</h2>
            <p>Talk to our academic team and get guidance about available programs.</p>
        </div>
        <a href="contact.html" class="btn btn-primary">Talk to Us →</a>
    </section>
</main>

<div id="site-footer"></div>

<script src="js/main.js"></script>

</html>
